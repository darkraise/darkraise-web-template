name: Release from tag

# Publishes the exact version named by a vX.Y.Z tag — both packages, since
# they share one version line — then writes that version and the rolled
# CHANGELOG back to master so the repo and npm cannot drift. This is the path
# for a major, or for any release whose number is a judgement call rather
# than something to infer from commit subjects.

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-darkraise
  cancel-in-progress: false

jobs:
  release:
    # Granted here, not just in the called workflow: a reusable workflow can
    # only narrow the caller's token, and this repository's default is
    # read-only, which would 403 the push after the publish had happened.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
