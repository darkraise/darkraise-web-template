name: Release on master

# Publishes darkraise-ui and create-darkraise-ui whenever master changes
# either of them. The two share one version line, so a release always ships
# both. The version comes from the commits since the last v* tag: a feat
# makes it a minor, anything else a patch, and a breaking marker stops the
# run so the major can be released deliberately with a tag.

on:
  push:
    branches: [master]
    # Only the published packages. A change to the pipeline is not a reason
    # to cut a release — test those with the workflow_dispatch dry run below.
    paths:
      - "packages/ui/**"
      - "create-app/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every gate without touching npm or master.
        type: boolean
        default: true

# One release at a time; never cancel one halfway through a publish.
concurrency:
  group: publish-darkraise
  cancel-in-progress: false

jobs:
  release:
    # Granted here, not just in the called workflow: a reusable workflow can
    # only narrow the caller's token, and this repository's default is
    # read-only, which would 403 the push after the publish had happened.
    permissions:
      contents: write
      id-token: write
    # The release commit this workflow pushes would otherwise trigger it
    # again. A push made with GITHUB_TOKEN does not start another workflow,
    # so this is a second line of defence — one that still holds if the token
    # is ever swapped for a PAT to satisfy branch protection.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/publish.yml
    with:
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
