name: Release on master

# Publishes darkraise-ui whenever master changes the package. The version is
# derived from the commits since the last ui-v* tag: a feat makes it a minor,
# anything else a patch, and a breaking marker stops the run so the major can
# be released deliberately with a tag.

on:
  push:
    branches: [master]
    # Only the package itself. A change to the pipeline is not a reason to
    # cut a release — test those with the workflow_dispatch dry run below.
    paths:
      - "packages/ui/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every gate without touching npm or master.
        type: boolean
        default: true

# One release at a time; never cancel one halfway through a publish.
concurrency:
  group: publish-darkraise-ui
  cancel-in-progress: false

jobs:
  release:
    # The release commit this workflow pushes would otherwise trigger it
    # again. A push made with GITHUB_TOKEN does not start another workflow,
    # so this is a second line of defence — one that still holds if the token
    # is ever swapped for a PAT to satisfy branch protection.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/publish-ui.yml
    with:
      dry_run: ${{ inputs.dry_run == true }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
